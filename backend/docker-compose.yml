services:
  db:
    image: postgres:17-alpine
    container_name: windup-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: windup
    ports:
      - "5432:5432"
    volumes:
      - windup-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  windup-pgdata:
